# These statuses report a number; neither blocks a merge. `main` does not
# require a status check. CI runs coverage through the justfile's `coverage`
# recipe, which passes `--fail-under-lines 0`, so that run never fails on
# coverage.
coverage:
  status:
    project:
      default:
        target: 90%
        # No slippage below the floor. Raise to tolerate a small drop.
        threshold: 0%
    patch:
      default:
        target: 90%
