# Patina CI.
#
# Every job installs the toolchains and runs a `justfile` recipe, so CI and
# local development share one set of commands.
#
# Operator note: macOS, Linux, and Windows are first-class. Add these check
# names to the required status checks for `main` to block a merge when lint
# or tests fail on any one OS, or when the dependency checks fail:
#
#   - Lint (ubuntu-latest), Lint (macos-latest), Lint (windows-latest)
#   - Test (ubuntu-latest), Test (macos-latest), Test (windows-latest)
#   - Dependencies
#
# Branch rules are administered on GitHub and cannot be expressed in this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # On each runner, `just lint` runs Clippy for the native target and for the
  # `justfile`'s `cross_targets`. Building for `aarch64-apple-darwin` compiles
  # Objective-C, so only the macOS runner lints that target.
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: rustup target add --toolchain stable $(just --evaluate cross_targets)
        shell: bash
      - run: just lint

  # On Linux, `just coverage` runs the suite under `cargo llvm-cov` and
  # replaces `just test` as the test gate. Coverage is informational and never
  # blocks a merge.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - if: matrix.os == 'ubuntu-latest'
        run: rustup component add --toolchain stable llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: ${{ matrix.os == 'ubuntu-latest' && 'just,cargo-llvm-cov' || 'just' }}
      - if: matrix.os == 'ubuntu-latest'
        run: just coverage
      - if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
      - if: matrix.os != 'ubuntu-latest'
        run: just test

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just doc

  # `just check-msrv` reads each package's `rust-version` from Cargo metadata.
  msrv:
    name: MSRV (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [patina, patina-core, patina-elevate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just
      - run: just check-msrv ${{ matrix.package }}

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just,cargo-audit,cargo-machete,cargo-deny
      - run: just dependencies
