[package]
name = "patina-core"
description = "Core library for the patina cross-platform dotfile manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["dotfiles", "config", "templating", "cross-platform"]
categories = ["config", "filesystem"]

[dependencies]
blake3 = { workspace = true }
camino = { workspace = true }
dunce = { workspace = true }
fs-err = { workspace = true }
fs2 = { workspace = true }
ignore = { workspace = true }
jiff = { workspace = true }
minijinja = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
notify-rust = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "fs",
    "process",
    "signal",
    "sync",
    "time",
    "io-util",
    "macros",
] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { workspace = true }
whoami = { workspace = true }

# Keep `shell` and `taskschd` local; patina-elevate needs only `advapi` and
# `kernel`.
[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true, features = ["shell", "taskschd"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
