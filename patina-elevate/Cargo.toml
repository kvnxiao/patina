[package]
name = "patina-elevate"
description = "Standalone Windows-only helper that sets the Developer Mode registry flag and applies Windows Defender path exclusions under one-time UAC elevation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["dotfiles", "windows", "elevation"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "patina-elevate"
required-features = ["windows"]

[features]
windows = []

[dependencies]
clap = { workspace = true }

[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
