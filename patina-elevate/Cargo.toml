[package]
name = "patina-elevate"
description = "Windows helper that sets the Developer Mode registry flag and applies Windows Defender path exclusions under one UAC prompt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["dotfiles", "windows", "elevation"]
categories = ["command-line-utilities", "os::windows-apis"]

[[bin]]
name = "patina-elevate"
required-features = ["windows"]

[features]
# The binary requires this feature. Windows packaging enables it;
# default non-Windows builds omit the helper binary.
windows = []

[dependencies]
# The helper has no workspace-crate dependency.
clap = { workspace = true }

# `winsafe` supplies the Windows registry API and stays out of non-Windows
# builds through the target-specific declaration.
[target.'cfg(windows)'.dependencies]
winsafe = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
