[workspace]
members = ["patina-cli", "patina-core", "patina-elevate"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Kevin Xiao <kevin@squint.ai>"]
repository = "https://github.com/kvnxiao/patina"
homepage = "https://github.com/kvnxiao/patina"
readme = "README.md"

[workspace.dependencies]
# Terminal styling for user-facing output (diff +/- lines, prompts, warnings,
# errors). `anstyle` defines the styles; `anstream` writes through an
# auto-stream that strips ANSI when the stream is not a terminal (or
# `--color never` / `NO_COLOR`) and enables Windows VT. Both crates, and their
# whole transitive stack, already resolve in the tree via clap's `color`
# feature, so adding them as direct deps introduces no new crates and clears
# `cargo deny` at no marginal cost.
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
blake3 = "1.5"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
# Strips Windows' `\\?\` verbatim path prefix from canonicalized paths where
# the plain form is equivalent. De-facto standard (Cargo, rustup, ripgrep all
# depend on it); zero dependencies; identity on non-Windows targets.
dunce = "1.0"
fs-err = "3.0"
fs2 = "0.4"
# Snapshot testing (dev-only). The diff renderer's golden-output test
# (unchanged targets omit their per-entry block and a single
# summary count line is printed) asserts against a committed snapshot so a
# regression in the human diff body shows as a reviewable snapshot diff.
# `default-features = false` drops the optional colour/glob/redaction extras
# we do not use, keeping the dev dep graph minimal at this add gate.
insta = { version = "1.43", default-features = false }
jiff = "0.2"
minijinja = "2.20"
notify = "8.2"
notify-debouncer-full = "0.7"
# Desktop drift notifications. The emit path sits behind an
# internal `NotificationSink` trait so headless CI drives a capture sink; only
# the production sink touches `notify-rust`. `default-features` left on:
# the crate's per-OS backend (zbus/DBus on Linux, mac-notification-sys on
# macOS, WinRT on Windows) is the feature set we need, and its transitive
# stack clears `cargo deny check` at this dep-add gate.
notify-rust = "4.17"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.1"
tabwriter = "1.4"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.52", default-features = false }
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
# NFC folding for the target-collision comparison key: APFS is
# normalization-insensitive, so two targets differing only in NFC/NFD spelling
# are one file on macOS. One transitive dep (`tinyvec`), against ~14 and
# embedded data for `icu_normalizer`.
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Host identity (hostname / username) via OS syscalls, not the unreliable
# `$HOSTNAME` / `$USER` env vars: those are unset under non-login shells and
# the systemd/launchd watcher services Patina ships.
whoami = "2.1"
# Windows-only: registry (Developer Mode flag) + process-token elevation
# read. `advapi` covers registry + tokens; `kernel` covers the
# base handle types. `taskschd` is deliberately NOT enabled. That surface
# belongs to the watcher service install, and enabling an unused
# feature now violates the enable-only-needed-features rule.
# 0.0.28 is the floor. Earlier releases only tolerate ERROR_INSUFFICIENT_BUFFER
# from the sizing call in `GetTokenInformation`, but the fixed-size
# `TokenElevation` class answers with ERROR_BAD_LENGTH instead, so the elevation
# read behind `is_elevated` failed on every call. Because that error is treated
# as "not elevated", every elevated process was reported as unelevated.
winsafe = { version = "0.0.28", features = ["advapi", "kernel"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Groups (broad coverage)
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Cargo group escape hatch: multiple versions inflate compile time but are
# rarely actionable for transitive deps; tighten once the dep graph stabilises.
multiple_crate_versions = "allow"

# Restriction lints, opt-in individually.

# Don't panic
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
unimplemented = "deny"

# Don't fail silently
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"

# Async correctness
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"

# Unsafe hygiene
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"

# Float correctness
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
invalid_upcast_comparisons = "deny"

# Misc footguns
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"

# Force #[expect(..., reason = "...")] over silent #[allow]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Performance
large_enum_variant = "warn"
large_stack_arrays = "deny"
needless_pass_by_value = "warn"

# Style
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
